# Continuous integration: lint, typecheck, test (incl. UI) and build-check.
# Every job is gated on the paths it actually covers (see the `changes` job), so a
# docs-only or markdown-only PR runs nothing but the cheap filter. Jobs skipped
# this way still report to branch protection, so the required checks stay green.
# UI + pure-crate tests run on macOS / Windows / Linux so the app is exercised on
# every shipped OS. Full Tauri (fmt/clippy/build-deps) runs on Linux.
# Cross-platform release artifacts are built separately in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the tree did this push / PR touch? Everything below keys off
  # this, so unrelated jobs never boot. Anything not listed here (docs/**, *.md,
  # plugin/**) matches nothing and skips the whole build.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
            frontend:
              - *shared
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'biome.jsonc'
            rust:
              - *shared
              - 'crates/**'
              - 'src-tauri/**'
              - 'scripts/bundle-cli.sh'

  lint:
    name: Lint (Biome)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting, lint and import order in one pass, read-only: a single
      # diagnostic fails the job, so nothing unformatted or unlinted merges.
      # `pnpm lint:fix` applies everything this would flag.
      - run: pnpm lint

  frontend:
    name: Frontend (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write # the coverage comment below
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Same suite (logic + UI, happy-dom) on every OS; Linux additionally
      # measures coverage so the PR gets a comment. Still no threshold — the
      # comment is a report, not a gate.
      - run: pnpm ${{ matrix.os == 'ubuntu-latest' && 'test:coverage' || 'test' }}
      - name: Comment coverage on the PR
        # Fork PRs get a read-only token and can't comment; skip rather than fail.
        if: >-
          matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: davelosert/vitest-coverage-report-action@v2
      - run: pnpm build

  rust-crates:
    name: Rust crates (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/reado-core
      # Pure crates — no Tauri sidecar / system deps needed. These hold the
      # OS-divergent logic (path anchoring, sessions, forge, search), so run them
      # on every OS to catch separator/case-sensitivity regressions.
      - name: Test core + cli
        run: |
          cargo test --manifest-path crates/reado-core/Cargo.toml
          cargo test --manifest-path crates/reado-cli/Cargo.toml

  rust-tauri:
    name: Rust Tauri (fmt + clippy + test, Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri.conf.json declares the CLI as an externalBin sidecar, so Tauri's
      # build script requires the binary to exist even for clippy/test.
      - name: Build the CLI sidecar
        run: bash scripts/bundle-cli.sh
      - name: Check formatting
        run: |
          for crate in crates/reado-core crates/reado-cli src-tauri; do
            cargo fmt --manifest-path "$crate/Cargo.toml" --all -- --check
          done
      - name: Clippy
        run: |
          for crate in crates/reado-core crates/reado-cli src-tauri; do
            cargo clippy --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings
          done
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
