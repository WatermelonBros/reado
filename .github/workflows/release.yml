# Cross-platform release builds for Reado.
#
# Triggered by pushing a version tag (e.g. `v0.1.0`) or manually. Produces
# native installers for macOS (Apple Silicon + Intel), Linux (AppImage + .deb)
# and Windows (MSI + NSIS), and publishes them to a draft GitHub Release.
#
# The binaries published here are the *official* build: this commit plus the
# closed Pro modules from the private WatermelonBros/reado-pro, checked out with a
# read-only deploy key held in the `release` environment (usable only from v* tags
# and main — never from forks or pull requests, which get no secrets). Without that
# secret the job builds the open-source app alone, exactly as before.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything but publish no release (artifacts only)"
        type: boolean
        default: true

permissions:
  contents: write

# Force HTTP/1.1 for cargo downloads: crates.io over HTTP/2 intermittently fails
# with "Error in the HTTP2 framing layer", flaking the Linux build.
env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "5"

jobs:
  # A release never builds pro code that fails its checks.
  pro-checks:
    uses: ./.github/workflows/pro-ci.yml
    secrets: inherit

  build:
    name: Build (${{ matrix.platform }})
    needs: pro-checks
    strategy:
      fail-fast: false
      # Serialize: tauri-action merges each platform into the release's
      # latest.json by read-modify-write, which races (and drops platforms)
      # when jobs run in parallel. One at a time keeps the manifest complete.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""
          - platform: windows-latest
            args: ""
            rust_target: ""
    runs-on: ${{ matrix.platform }}
    environment: release
    env:
      PRO: ${{ secrets.READO_PRO_DEPLOY_KEY != '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      # The official build wraps this exact commit: reado-pro, with this checkout
      # placed where its `reado` submodule goes. No source is printed or uploaded;
      # only the finished bundles leave the runner.
      - name: Check out the official build (reado-pro)
        if: env.PRO == 'true'
        uses: actions/checkout@v4
        with:
          repository: WatermelonBros/reado-pro
          ssh-key: ${{ secrets.READO_PRO_DEPLOY_KEY }}
          path: pro
          persist-credentials: false
      - name: Place this commit as the official build's core
        if: env.PRO == 'true'
        uses: actions/checkout@v4
        with:
          path: pro/reado
          persist-credentials: false

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both Apple targets are needed on macOS runners.
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PRO == 'true' && 'pro/app/src-tauri' || 'src-tauri' }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile ${{ env.PRO == 'true' && '--dir pro' || '' }}

      # Build the CLI sidecar for this matrix target (externalBin requires the
      # binary named for the exact target triple being built).
      - name: Build the CLI sidecar
        shell: bash
        run: bash ${{ env.PRO == 'true' && 'pro/reado/' || '' }}scripts/bundle-cli.sh ${{ matrix.rust_target }}

      # The official app's Tauri config is derived from this commit's own.
      - name: Derive the official build's config
        if: env.PRO == 'true'
        run: node pro/app/scripts/conf.mjs

      # The release page describes what actually shipped: the CHANGELOG section
      # for this tag, which the release commit already carries.
      - name: Collect the release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            bash scripts/release-notes.sh "${GITHUB_REF_NAME}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts so clients can verify them against the
          # public key in tauri.conf.json. Set these as repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization (Apple Developer ID). Ignored on
          # other platforms. Without these, macOS marks the app as "damaged".
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Baked into the Pro modules at compile time (neither is a secret).
          READO_API_URL: https://api.reado.watermelon-studio.it
          READO_ENTITLEMENT_PUBKEY: ZnJc5Ah7sgBv9M9aNqNGH9htC8taUHXiJZ28ikAOt3k
        with:
          projectPath: ${{ env.PRO == 'true' && 'pro/app' || '.' }}
          tauriScript: ${{ env.PRO == 'true' && 'pnpm tauri' || '' }}
          # A dry run names no tag, so tauri-action builds without releasing.
          tagName: ${{ env.DRY_RUN != 'true' && github.ref_name || '' }}
          releaseName: "Reado ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          # Publish immediately (not a draft) so the updater's `latest.json` under
          # /releases/latest actually advances — a draft never becomes "Latest",
          # so clients never see the new version. The serialized matrix above
          # keeps latest.json complete as each platform is appended.
          releaseDraft: false
          prerelease: false
          # Emit latest.json (the updater manifest) alongside the installers.
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ env.PRO == 'true' && '--config src-tauri/tauri.pro.conf.json' || '' }}

      # Dry run only: the bundles as a short-lived artifact, to check before tagging.
      - name: Upload the bundles (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}-${{ matrix.rust_target || 'native' }}
          path: |
            ${{ env.PRO == 'true' && 'pro/app/src-tauri' || 'src-tauri' }}/target/**/release/bundle/**
          retention-days: 3
          if-no-files-found: error

  # Announce the finished release in Discord.
  #
  # `needs: build` is the point: tauri-action publishes the release from the
  # *first* matrix job, so a webhook fired on "release published" would announce
  # it while three platforms are still building — readers would arrive at a page
  # with half the installers missing. This waits for every build to land, and is
  # skipped entirely if any of them failed: a broken release is not announced.
  announce:
    name: Announce on Discord
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post the release notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Set this secret to switch the announcement on; without it the job is
          # a no-op, so a fork never fails here for want of someone else's hook.
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK}" ]; then
            echo "No DISCORD_WEBHOOK secret set — nothing to announce to."
            exit 0
          fi
          # The notes are already written: the release body is this version's
          # CHANGELOG section, lifted out at tag time by release-notes.sh.
          name=$(gh release view "$TAG" --json name --jq '.name // ""')
          url=$(gh release view "$TAG" --json url --jq '.url')
          gh release view "$TAG" --json body --jq '.body' > notes.md
          # ponytail: truncated to Discord's 4096-character embed limit, minus
          # room for the ellipsis. If the changelogs outgrow it, split into
          # several embeds rather than cutting the tail off.
          body=$(head -c 4000 notes.md)
          # An `[ … ] && …` here would exit the script under `set -e` every time
          # the notes fit, which is every normal release.
          if [ "$(wc -c < notes.md)" -gt 4000 ]; then
            body="${body}"$'\n\n'"…full notes: ${url}"
          fi
          # Everything crosses into jq as data, never as shell interpolation: a
          # release body is Markdown someone wrote, not a script.
          jq -n --arg n "${name:-$TAG}" --arg b "$body" --arg u "$url" \
            '{content: "\($n) is out.",
              embeds: [{title: $n, url: $u, description: $b, color: 5814783}]}' \
            > payload.json
          curl -sS --fail-with-body -X POST \
            -H "Content-Type: application/json" \
            --data @payload.json "$WEBHOOK"
